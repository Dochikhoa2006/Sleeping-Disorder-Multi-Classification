<section class="model-panel">
  <h2>Your month at a glance</h2>
  <form class="diary-month-form" action="/diary" method="get">
    <label for="diary-month">Month<input id="diary-month" name="month" type="month" min="0001-01" max="9999-12" value="$month" required></label>
    <button type="submit">Show month →</button>
  </form>
  <p>$summary</p>
  <p class="hint">Each date is the night you went to bed. Filled cells show estimated sleep and the optional quality rating. Unrecorded nights are excluded from averages.</p>
  <div class="table-scroll" tabindex="0" role="region" aria-label="Monthly diary calendar">
    <table class="diary-calendar"><caption>$title</caption><thead><tr><th scope="col">Mon</th><th scope="col">Tue</th><th scope="col">Wed</th><th scope="col">Thu</th><th scope="col">Fri</th><th scope="col">Sat</th><th scope="col">Sun</th></tr></thead><tbody>$weeks</tbody></table>
  </div>
  <div class="diary-calendar-nav" aria-label="Browse diary months">$links</div>
</section>
