name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify diary works without third-party packages
        run: |
          python -S -m src.diary --file "$RUNNER_TEMP/diary.csv" add --date 2026-11-01 --bedtime 23:00 --wake-time 07:00 --awake-minutes 30 --quality 8
          python -S -m src.diary --file "$RUNNER_TEMP/diary.csv" summary --end 2026-11-02 --days 7

      - name: Run documented example workflows
        run: |
          python -m src.predict --input-json examples/patient.json --validate-only
          python -m src.predict --input-json examples/patient.json --output-json "$RUNNER_TEMP/example-predictions.json"
          python -m src.predict --input-csv examples/patients.csv --output-csv "$RUNNER_TEMP/example-predictions.csv"
          python -m src.model_info --include-features > "$RUNNER_TEMP/example-model-info.json"
          python -m src.compare_models --baseline models/sleep_disorder_pipeline.joblib --candidate models/sleep_disorder_pipeline.joblib --input-csv examples/patients.csv --fail-on-change > "$RUNNER_TEMP/example-model-comparison.json"

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit pinned dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements.txt

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build runtime image
        run: docker build -f Dockerfile.web -t sleep-web:test .

      - name: Verify container health and prediction with a read-only filesystem
        shell: bash
        run: |
          docker run --detach --name sleep-web-ci --read-only \
            --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:8765:8765 sleep-web:test
          trap 'docker logs sleep-web-ci; docker rm --force sleep-web-ci' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          test "$(docker exec sleep-web-ci id -u)" = 10001
          curl --fail --silent --show-error http://127.0.0.1:8765/api/predict \
            -H 'Content-Type: application/json' --data-binary @examples/patient.json \
            > prediction.json
          python -c 'import json; r=json.load(open("prediction.json")); assert r["count"] == 1; assert r["predictions"] == ["Healthy"]'
